# supabase/config.toml
# إعداد مشروع Supabase المحلي
#
# FIX: الإصدار الحالي من Supabase CLI لا يقبل project_id داخل قسم
# [project] — يجب أن يكون مفتاحاً جذرياً مباشراً في أول الملف.
# الخطأ السابق: "'config.config' has invalid keys: project"
project_id = "oispxxmxltkmkcmoqxmy"

[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322

[studio]
enabled = true
port = 54323

[functions.gemini-proxy]
verify_jwt = false
