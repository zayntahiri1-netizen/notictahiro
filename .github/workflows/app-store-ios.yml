name: 🍎 Build & Upload iOS → App Store

on:
  workflow_dispatch:
    inputs:
      submit_for_review:
        description: 'Submit for TestFlight automatically?'
        required: false
        default: 'false'
        type: boolean

jobs:
  build-ios:
    name: Build & sign iOS IPA
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ─────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node & dependencies ──────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci || npm install --no-audit --no-fund

      # ── 3. Build web (Capacitor mode) ───────────────────────
      - name: Build web app for Capacitor
        run: npm run build:cap
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_TOKEN: ${{ secrets.VITE_APP_TOKEN }}

      # ── 4. Capacitor iOS ────────────────────────────────────
      - name: Add iOS platform
        run: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          npx cap sync ios

      # ── 4.2 توليد أيقونات iOS وشاشة البداية (حرج!) ─────────
      # بدون هذه الخطوة يُرفع التطبيق بأيقونة Capacitor الافتراضية
      # وترفضه Apple (الأيقونة 1024px مطلوبة في App Store Connect)
      - name: Generate iOS app icons & splash
        run: |
          npx @capacitor/assets generate \
            --ios \
            --iconBackgroundColor '#040310' \
            --iconBackgroundColorDark '#040310' \
            --splashBackgroundColor '#0f172a' \
            --splashBackgroundColorDark '#040310'

      # ── 4.5 حقن Info.plist (حرج!) ──────────────────────────
      # بدون GADApplicationIdentifier ينهار التطبيق فور الإقلاع (AdMob)،
      # وبدون أوصاف الأذونات ترفض Apple المراجعة.
      - name: Apply iOS Info.plist config (AdMob + permissions)
        env:
          IOS_ADMOB_APP_ID: ${{ secrets.IOS_ADMOB_APP_ID }}
        run: bash ios-patches/apply-ios-config.sh

      # ── 5. CocoaPods ────────────────────────────────────────
      - name: Install CocoaPods
        working-directory: ios/App
        run: pod install --repo-update

      # ── 6. Import signing certificate ───────────────────────
      - name: Import code-signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/ios-signing.keychain-db
          echo "$CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $RUNNER_TEMP/certificate.p12 \
            -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      # ── 7. Download provisioning profile ────────────────────
      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/notic-tahiro.mobileprovision
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > $PP_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      # ── 8. Build archive ────────────────────────────────────
      - name: Build iOS archive
        working-directory: ios/App
        run: |
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath $RUNNER_TEMP/notic-tahiro.xcarchive \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ secrets.IOS_TEAM_ID }}" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}"

      # ── 9. Export IPA ───────────────────────────────────────
      - name: Export IPA
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ secrets.IOS_TEAM_ID }}</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/notic-tahiro.xcarchive \
            -exportPath $RUNNER_TEMP/ipa \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist

      # ── 10. Upload artifact ─────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: notictahiro-${{ github.run_number }}.ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 14

      # ── 11. Upload to TestFlight ─────────────────────────────
      - name: Upload to TestFlight
        if: ${{ secrets.APP_STORE_CONNECT_API_KEY != '' }}
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          xcrun altool --upload-app \
            -f $RUNNER_TEMP/ipa/*.ipa \
            --type ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --verbose
