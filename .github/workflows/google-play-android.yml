name: 🤖 Build Android — notictahiro

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ✅ package-lock.json موجود — npm ci أسرع وأكثر حتمية من npm install
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # FIX: حذفنا --ignore-scripts من npm ci لأنه يمنع sharp من تنزيل بيناراتها
      # (sharp تحتاج postinstall لتنزيل sharp-linux-x64.node من GitHub releases)
      # npm ci بدون --ignore-scripts يُشغّل جميع lifecycle scripts بشكل آمن.
      # تثبيت التبعيات: نحاول npm ci (سريع) لكن إن كان package-lock.json
      # قديماً (مكتبة جديدة أُضيفت لـ package.json ولم تُحدَّث في الـ lock)،
      # npm ci يفشل → نسقط لـ npm install الذي يُحدّث الـ lock ويثبّت الجديد.
      # هذا حاسم: المكتبات الأصلية (text-to-speech, file-picker) يجب أن
      # تُثبَّت فعلياً وإلا لن تعمل في الـ APK رغم وجودها في الكود.
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund || {
            echo "⚠️ npm ci فشل (lock قديم) → npm install لتحديثه وتثبيت الجديد"
            npm install --no-audit --no-fund
          }
          echo "✅ التبعيات مثبّتة"

      # ✅ CAPACITOR_BUILD=1 لتجنب vite-plugin-singlefile
      # ✅ حقن إعدادات Supabase من GitHub Secrets (حرج — بدونها الذكاء الاصطناعي لا يعمل)
      - name: Verify Supabase secrets
        run: |
          if [ -z "${{ secrets.VITE_SUPABASE_URL }}" ]; then
            echo "::warning::VITE_SUPABASE_URL غير موجود في GitHub Secrets — الذكاء الاصطناعي لن يعمل في هذا الـ APK!"
            echo "::warning::شغّل ./scripts/push-to-github.sh محلياً لرفع الـ secrets"
          else
            echo "✅ VITE_SUPABASE_URL موجود"
          fi

      - name: Build web
        run: CAPACITOR_BUILD=1 npx vite build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_TOKEN: ${{ secrets.VITE_APP_TOKEN }}

      # ✅ Java 21 مطلوب لـ Capacitor 8
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Add & sync Android
        run: |
          npx cap add android || true
          npx cap sync android

      # ✅ توليد الأيقونات التكيّفية + شاشة البداية لكل كثافات الأجهزة
      #
      # FIX نهائي (بدون sharp تماماً):
      # الأيقونات مُولَّدة مسبقاً بـ Python/Pillow وموجودة في android-patches/res/
      # → سكريبت apply-icons.sh ينسخها للمجلد الصحيح بعد cap sync
      # → لا حاجة لـ sharp أو @capacitor/assets أبداً — البناء لن يفشل مرة أخرى!
      # ✅ حارس: تأكّد أن إضافة AdMob ثبّتت فعلاً وسُجّلت في مشروع أندرويد.
      # القفل (package-lock.json) كان ناقصاً عدة حزم، فيسقط البناء إلى
      # npm install — وإن فشل ذلك بصمت يخرج APK بلا إعلانات إطلاقاً.
      # نفشل البناء بصوت عالٍ بدل شحن نسخة معطوبة.
      - name: Verify AdMob plugin is installed & registered
        run: |
          if [ ! -d "node_modules/@capacitor-community/admob" ]; then
            echo "❌ إضافة AdMob غير مثبّتة في node_modules"; exit 1
          fi
          PV=$(node -p "require('./node_modules/@capacitor-community/admob/package.json').version")
          echo "✅ إضافة AdMob مثبّتة — نسخة $PV"
          if grep -rq "capacitor-community/admob" android/capacitor.settings.gradle android/app/capacitor.build.gradle 2>/dev/null; then
            echo "✅ الإضافة مُسجّلة في مشروع أندرويد"
          else
            echo "❌ الإضافة غير مُسجّلة في Gradle — cap sync لم يلتقطها"
            echo "── capacitor.settings.gradle ──"; cat android/capacitor.settings.gradle 2>/dev/null
            exit 1
          fi

      - name: Copy pre-built icons & splash to Android (no sharp needed)
        run: bash android-patches/apply-icons.sh

      - name: Apply AdMob App ID to AndroidManifest
        run: bash android-patches/apply-admob.sh

      # ✅ امتثال Google Play: من 31 غشت 2026 كل تحديث يجب أن يستهدف
      # Android 16 (API 36) وإلا يُرفض في Play Console. Capacitor 8 يولّد
      # 36 افتراضياً، لكن نفرضه صراحةً ونتحقق منه حتى لا ينكسر الامتثال
      # بصمت لو تغيّر القالب أو رجعنا لإصدار أقدم من Capacitor.
      # ✅ يمنع نافذة "Something went wrong" عند الإقلاع:
      # AAB يُقسَّم إلى حزمة أساس + حزم مرافقة (لغة/كثافة/معمارية). إن وصل
      # الجهازَ الأساسُ وحده (استعادة نسخة احتياطية، نقل بين جهازين، تنزيل
      # ناقص، مدير تطبيقات صارم) يَعتبر النظام التثبيت ناقصاً ويمنع الفتح.
      # نُعطّل التقسيم: بلا حزم مرافقة لا يمكن أن تنقص واحدة.
      # الثمن: حجم تنزيل أكبر (موثّق داخل السكربت).
      - name: Disable AAB splits (prevents missing-splits dialog)
        run: |
          python3 scripts/inject-bundle-config.py
          echo "── كتلة bundle في build.gradle ──"
          grep -A5 'bundle {' android/app/build.gradle || true
          # حارس صارم: لو لم تُطبَّق الكتلة لأي سبب (تغيّر قالب Capacitor،
          # فشل صامت) يخرج AAB مقسّماً وتعود نافذة "Something went wrong"
          # عند بعض المستخدمين — ولن نكتشف ذلك إلا من شكاواهم. نُفشل
          # البناء هنا بدل شحن نسخة معطوبة.
          # ملاحظة: || true وليس || echo 0 — grep -c يطبع 0 ثم يخرج بـ1،
          # فيُضاف 0 ثانٍ وتصير القيمة سطرين فتفشل المقارنة ويمرّ الحارس بصمت.
          N=$(grep -c 'enableSplit = false' android/app/build.gradle || true)
          if [ "$N" -ne 3 ]; then
            echo "❌ تعطيل التقسيم غير مكتمل (enableSplit=false وُجد $N مرة، المطلوب 3: language/density/abi)"
            exit 1
          fi
          echo "✅ التقسيم معطّل بالكامل (language + density + abi)"

      - name: Enforce Google Play target API 36
        run: |
          VG=android/variables.gradle
          sed -i -E 's/(minSdkVersion[[:space:]]*=?[[:space:]]*)[0-9]+/\124/'        "$VG"
          sed -i -E 's/(compileSdkVersion[[:space:]]*=?[[:space:]]*)[0-9]+/\136/'    "$VG"
          sed -i -E 's/(targetSdkVersion[[:space:]]*=?[[:space:]]*)[0-9]+/\136/'     "$VG"
          echo "── variables.gradle ──"; cat "$VG"
          TARGET=$(grep -oE 'targetSdkVersion[[:space:]]*=?[[:space:]]*[0-9]+' "$VG" | grep -oE '[0-9]+$')
          if [ "$TARGET" != "36" ]; then
            echo "❌ targetSdkVersion=$TARGET — يجب أن يكون 36 (متطلب Play من 31/08/2026)"; exit 1
          fi
          echo "✅ targetSdkVersion=36 — مطابق لمتطلب Google Play"

      # ✅ FIX حرج: WebView له طبقة إذن داخلية منفصلة عن إذن النظام —
      # بدون هذا، يفشل الإدخال الصوتي (getUserMedia/SpeechRecognition)
      # بصمت حتى مع موافقة المستخدم على RECORD_AUDIO.
      - name: Fix microphone permission inside WebView
        run: bash android-patches/apply-mic-permission.sh

      # ✅ ميزة الفقعة العائمة (تطفو فوق كل التطبيقات): إذن خاص +
      # خدمة Foreground + Plugin مخصص. يُعيد كتابة MainActivity.java
      # بنسخة شاملة (ميكروفون + فقعة معاً) — لذا يُشغَّل بعد السطر أعلاه.
      - name: Apply floating bubble overlay feature
        run: bash android-patches/apply-bubble-overlay.sh

      # ✅ "مشاركة إلى Notic Tahiro" من أي تطبيق (Share Target)
      # ⚠️ يجب أن يبقى **بعد** apply-bubble-overlay.sh مباشرة: ذاك يُعيد
      # كتابة MainActivity.java و BubbleOverlayPlugin.java بالكامل، فلو
      # سبقه هذا السكربت لمُحيت إضافاته بصمت بلا أي فشل في الـ build.
      - name: Apply share target (share text → note)
        run: bash android-patches/apply-share-target.sh

      # تحقّق صارم: الترقيع أعلاه صامت إن تغيّرت بنية MainActivity، وعطبٌ
      # صامت هنا = ميزة غائبة في متجر Play لا يكتشفها أحد. نفشل الآن بدلاً.
      - name: Verify share target is wired
        run: |
          set -e
          MAIN=$(find android/app/src/main/java -name MainActivity.java | head -1)
          PLUGIN=$(find android/app/src/main/java -name BubbleOverlayPlugin.java | head -1)
          FAIL=0
          grep -q 'android.intent.action.SEND' android/app/src/main/AndroidManifest.xml \
            || { echo "::error::intent-filter SEND مفقود من AndroidManifest"; FAIL=1; }
          # 3 = تعريف الدالة + نداءان (onCreate و onNewIntent)
          N=$(grep -c 'captureSharedText(' "$MAIN" || true)
          [ "$N" = "3" ] \
            || { echo "::error::captureSharedText: متوقَّع 3 مواضع، وُجد $N"; FAIL=1; }
          grep -q 'getPendingShare' "$PLUGIN" \
            || { echo "::error::getPendingShare مفقود من BubbleOverlayPlugin"; FAIL=1; }
          [ "$FAIL" = "0" ] || exit 1
          echo "✅ Share Target موصول بالكامل"

      # ✅ ويدجت الشاشة الرئيسية (4 أزرار سريعة)
      # يُعيد استعمال عقد bubble_action، فيأتي بعد apply-bubble-overlay.sh
      - name: Apply home screen widget
        run: bash android-patches/apply-widget.sh

      # تحقّق صارم: ويدجت ناقص مورداً لا يفشل البناء — يفشل عند
      # التضخيم على جهاز المستخدم، ولا نراه نحن أبداً.
      - name: Verify widget is wired
        run: |
          set -e
          RES=android/app/src/main/res
          PROVIDER=$(find android/app/src/main/java -name NoticWidgetProvider.java | head -1)
          FAIL=0
          for f in "$RES/layout/widget_notic.xml" "$RES/xml/widget_notic_info.xml" \
                   "$RES/drawable/widget_bg.xml" "$RES/drawable/widget_btn.xml"; do
            [ -f "$f" ] || { echo "::error::مورد الويدجت مفقود: $f"; FAIL=1; }
          done
          [ -n "$PROVIDER" ] || { echo "::error::NoticWidgetProvider.java مفقود"; FAIL=1; }
          grep -q 'NoticWidgetProvider' android/app/src/main/AndroidManifest.xml \
            || { echo "::error::<receiver> الويدجت غير مُسجَّل"; FAIL=1; }
          # FLAG_IMMUTABLE إلزامي منذ أندرويد 12، وغيابه استثناء وقت التشغيل.
          # ⚠️ نبحث عن الاستدعاء المؤهَّل لا عن الكلمة: الكلمة واردة في
          # تعليق الملف، فبحثٌ ساذج عنها ينجح حتى بعد حذفها من الكود.
          grep -q 'PendingIntent\.FLAG_IMMUTABLE' "$PROVIDER" \
            || { echo "::error::FLAG_IMMUTABLE مفقود — سيرمي على أندرويد 12+"; FAIL=1; }
          grep -q 'PendingIntent\.FLAG_UPDATE_CURRENT' "$PROVIDER" \
            || { echo "::error::FLAG_UPDATE_CURRENT مفقود — كل الأزرار ستفتح نفس الشاشة"; FAIL=1; }
          # كل R.id مستعمل يجب أن يوجد في التخطيط، وإلا فشل التضخيم
          python3 - "$PROVIDER" "$RES/layout/widget_notic.xml" <<'PY'
          import re, sys
          java = open(sys.argv[1], encoding='utf-8').read()
          lay  = open(sys.argv[2], encoding='utf-8').read()
          ids  = set(re.findall(r'android:id="@\+id/(\w+)"', lay))
          used = set(re.findall(r'R\.id\.(\w+)', java))
          missing = used - ids
          if missing:
              print(f"::error::R.id غير موجود في التخطيط: {sorted(missing)}")
              sys.exit(1)
          print("✅ كل R.id مطابق للتخطيط")
          PY
          [ "$FAIL" = "0" ] || exit 1
          echo "✅ الويدجت موصول بالكامل"

      # ✅ Firebase الأصلي (google-services.json + Analytics SDK)
      # لا يتعارض مع MainActivity.java — فقط ملفات gradle + json
      - name: Apply native Firebase config
        run: bash android-patches/apply-firebase.sh

      # ✅ محرك النطق الأصلي (queries لـ TTS في Manifest)
      - name: Apply native TTS config
        run: bash android-patches/apply-tts.sh

      # ✅ اسم التطبيق الظاهر عند التثبيت (Notic Tahiro Ai)
      - name: Apply app name
        run: bash android-patches/apply-app-name.sh

      # ✅ سقف صياغة جافاسكربت — أخطر عطب في هذا الملف كله
      # صياغة أحدث مما يفهمه WebView لا تُنتج تعطّلاً ولا رسالة: الحزمة
      # لا تُحلَّل، فتبقى الشاشة فارغة. ولا يظهر ذلك للمطوّر لأن WebView
      # لديه محدَّث، بينما يظهر لمن لم يُحدَّث جهازه ولمصفوفات اختبار Play.
      - name: Verify JS syntax target is safe for old WebView
        run: |
          python3 - <<'PY'
          import re, sys
          cfg = open('vite.config.ts', encoding='utf-8').read()
          m = re.search(r'target:\s*(\[[^\]]*\]|"[^"]*"|\'[^\']*\')', cfg)
          if not m:
              print("::error::لم يُعثر على build.target في vite.config.ts"); sys.exit(1)
          raw = m.group(1)
          targets = re.findall(r'["\']([^"\']+)["\']', raw)
          print(f"  الهدف المُعلَن: {targets}")

          # <script type="module"> نفسه يبدأ من Chrome 61، فهو السقف الطبيعي.
          # أي هدف أحدث يُخرج صياغة لا يحتملها WebView الأصلي على أندرويد 7/8.
          bad, broken = [], []
          for t in targets:
              c = re.fullmatch(r'chrome(\d+)', t)
              e = re.fullmatch(r'es(\d{4})', t)
              s = re.fullmatch(r'safari(\d+)', t)
              if c and int(c.group(1)) > 61: bad.append(t)
              if e and int(e.group(1)) > 2017: bad.append(t)
              if t in ('esnext', 'modules'): bad.append(t)
              # صفر حدّ أدنى لا أعلى: esbuild يعلم أن Safari ≤14 فيه عطب
              # في الـdestructuring فيحاول ترجمته نزولاً — وهو تحويل غير
              # مُنفَّذ عنده، فيفشل البناء كلّه. ليس نقص دعم بل عطب معروف.
              if s and int(s.group(1)) < 15: broken.append(t)
          if bad:
              print(f"::error::هدف بناء أحدث من اللازم: {bad} — "
                    f"سيُخرج ?. و ?? خاماً فتبقى الشاشة فارغة على WebView قديم")
          if broken:
              print(f"::error::هدف يكسر البناء: {broken} — esbuild يعجز عن "
                    f"ترجمة الـdestructuring لـSafari ≤14. استعمل safari15 فأعلى")
          if bad or broken:
              sys.exit(1)
          if not any(re.fullmatch(r'chrome\d+|es\d{4}', t) for t in targets):
              print("::error::الهدف لا يحدّد إصداراً صريحاً — أضف chrome61"); sys.exit(1)
          print("✅ سقف الصياغة آمن لـ WebView القديم")
          PY

      # ✅ متطلبات العتاد — يجب أن يأتي **بعد** كل سكربت يُضيف أذونات،
      # لأن أندرويد يستنتج المتطلبات من الأذونات الموجودة وقت البناء.
      - name: Declare hardware features as optional
        run: bash android-patches/apply-uses-feature.sh

      # تحقّق صارم: إذنٌ يستلزم عتاداً بلا تصريح required="false" يجعل
      # Play يحجب التطبيق عن كل جهاز يفتقد ذلك العتاد — لا خطأ بناء، ولا
      # تعطّل، فقط مستخدمون لا يستطيعون التثبيت ولا نعرف عنهم شيئاً.
      - name: Verify hardware features are optional
        run: |
          python3 - <<'PY'
          import sys, xml.etree.ElementTree as ET
          NS = '{http://schemas.android.com/apk/res/android}'
          root = ET.parse('android/app/src/main/AndroidManifest.xml').getroot()

          # الأذونات التي يستنتج منها أندرويد متطلَّب عتاد ضمنياً
          IMPLIED = {
              'android.permission.RECORD_AUDIO': 'android.hardware.microphone',
              'android.permission.CAMERA': 'android.hardware.camera',
              'android.permission.ACCESS_FINE_LOCATION': 'android.hardware.location.gps',
              'android.permission.CALL_PHONE': 'android.hardware.telephony',
              'android.permission.BLUETOOTH': 'android.hardware.bluetooth',
          }
          perms = {p.get(NS + 'name') for p in root.findall('uses-permission')}
          feats = {f.get(NS + 'name'): f.get(NS + 'required') for f in root.findall('uses-feature')}

          fail = False
          for perm, feature in IMPLIED.items():
              if perm in perms and feats.get(feature) != 'false':
                  print(f"::error::{perm} يستلزم {feature} ضمنياً بـ required=true "
                        f"(الحالي: {feats.get(feature)}) — سيُحجب التطبيق عن الأجهزة بلا هذا العتاد")
                  fail = True

          # شاشة اللمس متطلَّبة افتراضياً لكل تطبيق
          if feats.get('android.hardware.touchscreen') != 'false':
              print("::error::touchscreen متطلَّب افتراضياً — أعلنه required=\"false\"")
              fail = True

          sys.exit(1) if fail else print("✅ كل متطلبات العتاد اختيارية — لا حجب عند التنزيل")
          PY

      # ── تفعيل R8: تقليص وتحسين وتعتيم رمز DEX ─────────────────────
      # لوحة Play: «تحسين رمز DEX منخفضة» — R8 مُطفأ، وحجم DEX غير
      # المضغوط 18.4MB (فوق عتبة التنبيه). التأثير في نسخة الإصدار
      # وحدها، ولذلك يليه فحصٌ يُثبت نجاة الإضافات فعلياً.
      - name: Enable R8 (DEX optimization)
        env:
          # مفتاح إطفاء بلا تعديل كود: Settings → Variables → DISABLE_R8=1
          DISABLE_R8: ${{ vars.DISABLE_R8 }}
        run: bash android-patches/apply-r8.sh

      # ✅ versionCode تلقائي — كل build له رقم أعلى (متطلب Play Store الصارم)
      - name: Auto-increment versionCode
        run: |
          VERSION_CODE=$(( ${{ github.run_number }} + 100 ))
          VERSION_NAME="1.0.${{ github.run_number }}"
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          echo "📦 versionCode=$VERSION_CODE versionName=$VERSION_NAME"
          grep -E "versionCode|versionName" android/app/build.gradle | head -2

      - name: Decode keystore
        run: |
          # المصدر 1: GitHub Secret (الأولوية — للنشر التلقائي)
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
            echo "✅ keystore من GitHub Secrets"
          # المصدر 2: ملف upload-key.keystore.b64 داخل المشروع (للطوارئ)
          elif [ -f "upload-key.keystore.b64" ]; then
            base64 --decode upload-key.keystore.b64 > android/app/release.keystore
            echo "✅ keystore من ملف .b64 المحلي"
          else
            echo "::error::❌ لا يوجد keystore! أضف ANDROID_KEYSTORE_BASE64 لـ Secrets أو upload-key.keystore.b64 للمشروع"
            exit 1
          fi
          SIZE=$(stat -c%s android/app/release.keystore)
          if [ "$SIZE" -lt 1000 ]; then
            echo "::error::release.keystore حجمه ${SIZE} bytes — تالف!"
            exit 1
          fi
          echo "✅ keystore سليم (${SIZE} bytes)"

          # ── تحقّق من بصمة التوقيع (SHA1) لضمان ثبات المفتاح عبر التحديثات ──
          # نطبع البصمة في كل بناء. إن ضبطت EXPECTED_KEYSTORE_SHA1 كـ Secret،
          # يرفض البناء عند أي اختلاف — حماية من رفع AAB بتوقيع خاطئ يكسر التحديث.
          if [ -n "${{ secrets.ANDROID_KEY_ALIAS }}" ] && [ -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ]; then
            ACTUAL_SHA1=$(keytool -list -v \
              -keystore android/app/release.keystore \
              -alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
              -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" 2>/dev/null \
              | grep -i "SHA1:" | head -1 | sed 's/.*SHA1: //' | tr -d ' ')
            echo "🔑 بصمة التوقيع SHA1: ${ACTUAL_SHA1}"
            echo "ℹ️ احفظ هذه البصمة — يجب أن تبقى ثابتة في كل تحديث."

            EXPECTED="${{ secrets.EXPECTED_KEYSTORE_SHA1 }}"
            if [ -n "$EXPECTED" ]; then
              EXP_CLEAN=$(echo "$EXPECTED" | tr -d ' :' | tr '[:lower:]' '[:upper:]')
              ACT_CLEAN=$(echo "$ACTUAL_SHA1" | tr -d ' :' | tr '[:lower:]' '[:upper:]')
              if [ "$EXP_CLEAN" != "$ACT_CLEAN" ]; then
                echo "::error::❌ بصمة التوقيع تغيّرت! المتوقّع=${EXPECTED} الفعلي=${ACTUAL_SHA1}"
                echo "::error::هذا keystore مختلف — رفعه سيكسر تحديثات Play Store. أوقفنا البناء للحماية."
                exit 1
              fi
              echo "✅ بصمة التوقيع مطابقة — التوقيع ثابت وآمن للتحديث"
            else
              echo "💡 نصيحة: أضف Secret باسم EXPECTED_KEYSTORE_SHA1 بقيمة البصمة أعلاه"
              echo "   لتفعيل الحماية التلقائية ضد تغيّر التوقيع في التحديثات القادمة."
            fi
          fi

      # ── 1. Debug APK (للتجربة) ───────────────────────────
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # ── 2. Release APK (موقّع) ───────────────────────────
      - name: Build release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/app/release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --no-daemon

      # ── التحقّق من أن R8 لم يكسر الإضافات ──────────────────────────
      # ⚠️ هذه الخطوة هي ما يجعل تفعيل R8 آمناً، وبدونها لا يجوز تفعيله.
      #
      # Capacitor يُحمّل كل إضافة بـ Class.forName باسمها النصّي من
      # capacitor.plugins.json. فإن أعاد R8 تسمية الصنف، يبقى البناء
      # ناجحاً وتسقط الإضافة عند المستخدم وحده: الإعلانات تختفي، والصوت
      # يصمت، والملفات لا تُحفظ — بلا رسالة خطأ واحدة.
      #
      # وملف DEX يخزّن أسماء الأصناف كسلاسل بصيغة Lcom/foo/Bar;، فوجود
      # السلسلة دليلٌ مباشر على أن الاسم لم يُمسّ. نفحص الحزمة الناتجة
      # فعلياً، لا الإعدادات التي طلبناها.
      - name: Verify R8 kept all Capacitor plugins
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          PLUGINS=android/app/src/main/assets/capacitor.plugins.json
          [ -f "$PLUGINS" ] || { echo "::error::$PLUGINS غير موجود"; exit 1; }
          python3 - "$APK" "$PLUGINS" <<'PY'
          import json, re, sys, zipfile

          apk, plugins_json = sys.argv[1], sys.argv[2]
          classpaths = [p['classpath'] for p in json.load(open(plugins_json, encoding='utf-8'))
                        if p.get('classpath')]
          if not classpaths:
              print('::error::capacitor.plugins.json فارغ — لا إضافات لفحصها')
              sys.exit(1)

          # ⚠️ أصناف هذا التطبيق الأصلية — ليست في capacitor.plugins.json.
          # BubbleOverlayPlugin إضافة مكتوبة هنا لا من npm، والثلاثة
          # الباقية خدمات ومستقبِلات معلَنة في البيان. فحصٌ يقرأ ملف
          # الإضافات وحده يتركها خارج التغطية — وهي نصف الميزات الأصلية.
          classpaths += [
              'com.notictahiro.app.BubbleOverlayPlugin',
              'com.notictahiro.app.BubbleService',
              'com.notictahiro.app.BubbleBootReceiver',
              'com.notictahiro.app.NoticWidgetProvider',
              'com.notictahiro.app.MainActivity',
          ]

          blob = b''
          with zipfile.ZipFile(apk) as z:
              dex = [n for n in z.namelist() if re.fullmatch(r'classes\d*\.dex', n)]
              if not dex:
                  print('::error::لا ملفات DEX داخل الحزمة')
                  sys.exit(1)
              for n in dex:
                  blob += z.read(n)

          print(f'🔍 {len(dex)} ملف DEX · {len(blob)//1048576} ميغابايت · {len(classpaths)} إضافة')

          missing = [cp for cp in classpaths
                     if ('L' + cp.replace('.', '/') + ';').encode() not in blob]
          for cp in classpaths:
              print(('  ❌ ' if cp in missing else '  ✅ ') + cp)

          if missing:
              print(f'::error::{len(missing)} إضافة اختفت من DEX بعد R8 — '
                    'ستفشل Class.forName عند المستخدم. راجع proguard-notic.pro')
              sys.exit(1)
          print(f'✅ كل الإضافات ({len(classpaths)}) نجت من R8 بأسمائها الأصلية')
          PY

      # ── 3. Release AAB (للـ Play Store) ─────────────────
      - name: Build release AAB
        working-directory: android
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$PWD/app/release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --no-daemon

      # ── رفع الملفات الثلاثة ──────────────────────────────
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: notictahiro-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: notictahiro-release-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: notictahiro-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

      # ── قياس نتائج R8 من الحزمة النهائية ──────────────────────────
      # وثيقة Google لمعالجة «تحسين رموز DEX منخفض» تطلب فتح الحزمة في
      # أداة تحليل APK داخل Android Studio. وهذا متعذّر هنا: البناء بلا
      # واجهة، والعمل من Termux على هاتف. فنُعيد التحليل في السجلّ.
      #
      # والأهمّ أنّ r8.json يحمل — بنصّ الوثيقة — البيانات الوصفية
      # الدقيقة التي تحتسب منها «مؤشرات Android الحيوية» النتيجة. فطبعُه
      # يعني رؤية أرقام Play قبل الرفع لا بعد أسبوع من النشر.
      #
      # ⚠️ موضعها بعد الرفع عن قصد، وتنتهي بـexit 0 دائماً: خطوة قياس
      #    لا يجوز أن تحجب ملفاتٍ بُنيت بنجاح.
      - name: Measure DEX size and R8 results
        run: |
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab 2>/dev/null | head -1)
          bash android-patches/measure-dex.sh "$AAB"
